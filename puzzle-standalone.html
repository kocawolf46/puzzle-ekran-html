<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mainan Puzzle Photo - Standalone</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
body{background:#000;color:#fff;min-height:100vh;overflow-x:hidden;display:flex;flex-direction:column;align-items:center}
.topbar{width:100%;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;z-index:10}
.topbar h1{font-size:16px;letter-spacing:.5px;opacity:.9}
.badge{background:#1a1a1a;border:1px solid #2a2a2a;padding:6px 12px;border-radius:20px;font-size:12px}
.stage{width:100%;max-width:520px;aspect-ratio:9/12;position:relative;background:#0a0a0a;border-radius:24px;overflow:hidden;margin:10px 16px;border:1px solid #222}
video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#photoCanvas{display:none}
.overlay{position:absolute;inset:0;pointer-events:none}
.frame{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:68%;aspect-ratio:1;border:2px solid #fff;box-shadow:0 0 0 200vmax rgba(0,0,0,.55);border-radius:4px;transition:all .2s}
.frame::before,.frame::after{content:'';position:absolute;width:18px;height:18px;border-color:#fff;border-style:solid}
.frame::before{left:-2px;top:-2px;border-width:4px 0 0 4px}
.frame::after{right:-2px;bottom:-2px;border-width:0 4px 4px 0}
.countdown{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:120px;font-weight:900;line-height:1;text-shadow:0 8px 30px rgba(0,0,0,.8);animation:pop .6s ease}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}50%{transform:translate(-50%,-50%) scale(1.2)}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}
.controls{width:100%;max-width:520px;padding:16px;display:flex;flex-direction:column;gap:12px}
.btn{width:100%;padding:16px;border-radius:16px;border:0;font-weight:700;font-size:15px;cursor:pointer;transition:transform .1s,opacity .2s}
.btn:active{transform:scale(.98)}
.primary{background:#fff;color:#000}
.secondary{background:#1c1c1e;color:#fff;border:1px solid #2c2c2e}
.hint{font-size:13px;opacity:.6;text-align:center;line-height:1.4;padding:4px 12px}
.puzzle-wrap{width:100%;max-width:520px;padding:12px 16px;display:none;flex-direction:column;gap:14px}
.puzzle-header{display:flex;align-items:center;gap:12px}
.thumb{width:64px;height:64px;border-radius:12px;overflow:hidden;border:1px solid #2a2a2a;flex-shrink:0;background:#111}
.thumb img{width:100%;height:100%;object-fit:cover}
.grid{width:100%;aspect-ratio:1;display:grid;grid-template-columns:repeat(3,1fr);gap:3px;background:#111;border-radius:18px;padding:3px;border:1px solid #222}
.tile{position:relative;background:#000;border-radius:8px;overflow:hidden;cursor:grab;user-select:none;touch-action:none;transition:transform .12s,box-shadow .12s}
.tile:active{cursor:grabbing;transform:scale(.97);z-index:2}
.tile.empty{background:transparent;box-shadow:inset 0 0 0 1px #222}
.tile img{width:300%;height:300%;max-width:none;object-fit:cover;pointer-events:none;transform:scaleX(-1)}
.tile.correct{box-shadow:inset 0 0 0 2px #fff}
.win{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(12px);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:50;padding:20px;text-align:center}
.win-card{width:100%;max-width:340px;background:#111;border:1px solid #2a2a2a;border-radius:24px;padding:20px;animation:cardIn .5s cubic-bezier(.175,.885,.32,1.275)}
@keyframes cardIn{from{transform:translateY(30px) rotate(-3deg) scale(.9);opacity:0}to{transform:translateY(0) rotate(0) scale(1);opacity:1}}
.win-card img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:16px;border:2px solid #fff;margin-bottom:16px}
.confetti{position:fixed;top:-10px;width:10px;height:10px;border-radius:50%;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
input[type=file]{display:none}
.crop-wrap{width:100%;max-width:520px;display:none;flex-direction:column;gap:12px;padding:16px}
.crop-box{width:100%;aspect-ratio:1;position:relative;overflow:hidden;border-radius:20px;background:#111;border:1px solid #222}
.crop-box img{width:100%;height:100%;object-fit:contain}
</style>
</head>
<body>
<div class="topbar">
<h1>mainan puzzle photo</h1>
<span class="badge">offline • single file</span>
</div>

<div class="stage" id="stage">
<video id="video" autoplay playsinline muted></video>
<canvas id="photoCanvas"></canvas>
<div class="overlay">
<div class="frame" id="frame"></div>
<div id="countEl"></div>
</div>
</div>

<div class="controls" id="controls">
<button class="btn primary" id="startCam">📷 Kamerayı Başlat</button>
<button class="btn secondary" id="snapBtn" style="display:none">Fotoğraf Çek (3-2-1)</button>
<button class="btn secondary" id="uploadBtn">🖼️ Galeriden Yükle</button>
<input type="file" id="fileInp" accept="image/*">
<div class="hint" id="hint">Kamerayı başlat, yüzünü beyaz çerçeveye ortala ve çek. Videodaki gibi 3x3 puzzle'a dönüşecek.</div>
</div>

<div class="crop-wrap" id="cropWrap">
<div class="crop-box"><img id="cropImg"></div>
<button class="btn primary" id="makePuzzleBtn">Puzzle Yap</button>
<button class="btn secondary" id="cancelCrop">Geri</button>
</div>

<div class="puzzle-wrap" id="puzzleWrap">
<div class="puzzle-header">
<div class="thumb"><img id="thumbImg"></div>
<div><div style="font-weight:700">Puzzle'ı Çöz</div><div style="font-size:12px;opacity:.6">Parçaları sürükle • Boşluğa taşı</div></div>
<div style="margin-left:auto;display:flex;gap:8px">
<button class="btn secondary" style="width:auto;padding:10px 14px" id="shuffleBtn">Karıştır</button>
<button class="btn secondary" style="width:auto;padding:10px 14px" id="resetBtn">Baştan</button>
</div>
</div>
<div class="grid" id="grid"></div>
<div class="hint">Hamle: <span id="moves">0</span> • Doğru parçalar beyaz çerçeve alır</div>
</div>

<div class="win" id="win">
<div class="win-card">
<img id="winImg">
<h2 style="font-size:22px;margin-bottom:6px">Tebrikler! 🎉</h2>
<p style="opacity:.7;font-size:13px;margin-bottom:14px">Puzzle'ı <span id="winMoves"></span> hamlede çözdün</p>
<button class="btn primary" id="playAgain">Play Again</button>
</div>
</div>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('photoCanvas');
const stage = document.getElementById('stage');
const frame = document.getElementById('frame');
const countEl = document.getElementById('countEl');
const startCam = document.getElementById('startCam');
const snapBtn = document.getElementById('snapBtn');
const uploadBtn = document.getElementById('uploadBtn');
const fileInp = document.getElementById('fileInp');
const hint = document.getElementById('hint');
const controls = document.getElementById('controls');
const cropWrap = document.getElementById('cropWrap');
const cropImg = document.getElementById('cropImg');
const makePuzzleBtn = document.getElementById('makePuzzleBtn');
const cancelCrop = document.getElementById('cancelCrop');
const puzzleWrap = document.getElementById('puzzleWrap');
const grid = document.getElementById('grid');
const thumbImg = document.getElementById('thumbImg');
const movesEl = document.getElementById('moves');
const win = document.getElementById('win');
const winImg = document.getElementById('winImg');
const winMoves = document.getElementById('winMoves');
const playAgain = document.getElementById('playAgain');
const shuffleBtn = document.getElementById('shuffleBtn');
const resetBtn = document.getElementById('resetBtn');

let stream=null;
let capturedDataUrl=null;
let tiles=[];
let emptyIdx=8;
let moves=0;
let originalOrder=[];

async function initCam(){
 try{
  hint.textContent='Kamera isteniyor...';
  stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}},audio:false});
  video.srcObject=stream;
  await video.play();
  startCam.style.display='none';
  snapBtn.style.display='block';
  stage.style.display='block';
  controls.style.display='flex';
  cropWrap.style.display='none';
  puzzleWrap.style.display='none';
  hint.textContent='Harika! Yüzünü çerçeveye ortala ve Fotoğraf Çek de.';
 }catch(e){
  hint.textContent='Kamera izni verilmedi: '+e.message+' — Galeriden yükleyebilirsin.';
  console.error(e);
 }
}
startCam.onclick=initCam;

function doCountdownThenSnap(){
 let c=3;
 countEl.innerHTML='';
 const iv=setInterval(()=>{
  if(c>0){
   countEl.innerHTML=`<div class="countdown">${c}</div>`;
   c--;
  }else{
   clearInterval(iv);
   countEl.innerHTML='';
   snapPhoto();
  }
 },700);
}
snapBtn.onclick=doCountdownThenSnap;

function snapPhoto(){
 const vw=video.videoWidth, vh=video.videoHeight;
 if(!vw) return;
 canvas.width=800; canvas.height=800;
 const ctx=canvas.getContext('2d');
 // calculate frame area: 68% width centered
 const sx = (vw - vw*0.68)/2;
 const sy = (vh - vw*0.68)/2;
 const sSize = vw*0.68;
 ctx.save();
 ctx.scale(-1,1);
 ctx.drawImage(video, -vw,0,vw,vh);
 ctx.restore();
 // we actually drew full, now crop to frame area mirrored logic simpler: capture full then crop
 // For simplicity, take center square 68%
 const temp = document.createElement('canvas');
 temp.width=800; temp.height=800;
 const tctx=temp.getContext('2d');
 // draw video mirrored cropped
 tctx.save();
 tctx.scale(-1,1);
 // map frame rect to canvas
 const scaleX = 800 / stage.clientWidth;
 // approximate: take center 68% of video
 tctx.drawImage(video, -800,0,800,800);
 tctx.restore();
 capturedDataUrl = temp.toDataURL('image/jpeg',0.92);
 startPuzzle(capturedDataUrl);
}

uploadBtn.onclick=()=>fileInp.click();
fileInp.onchange=e=>{
 const file=e.target.files[0];
 if(!file) return;
 const url=URL.createObjectURL(file);
 cropImg.src=url;
 capturedDataUrl=null;
 stage.style.display='none';
 controls.style.display='none';
 cropWrap.style.display='flex';
 puzzleWrap.style.display='none';
};
cancelCrop.onclick=()=>{
 cropWrap.style.display='none';
 stage.style.display='block';
 controls.style.display='flex';
 if(stream){ stage.style.display='block'; }
};
makePuzzleBtn.onclick=()=>{
 // use cropImg as source - draw to canvas square
 const c=document.createElement('canvas');
 c.width=800;c.height=800;
 const ctx=c.getContext('2d');
 // cover
 const img=cropImg;
 const iw=img.naturalWidth, ih=img.naturalHeight;
 const size=Math.min(iw,ih);
 const sx=(iw-size)/2, sy=(ih-size)/2;
 ctx.drawImage(img,sx,sy,size,size,0,0,800,800);
 capturedDataUrl=c.toDataURL('image/jpeg',0.92);
 cropWrap.style.display='none';
 startPuzzle(capturedDataUrl);
};

function startPuzzle(dataUrl){
 thumbImg.src=dataUrl;
 winImg.src=dataUrl;
 capturedDataUrl=dataUrl;
 // hide camera UI
 stage.style.display='none';
 controls.style.display='none';
 cropWrap.style.display='none';
 puzzleWrap.style.display='flex';
 initTiles();
}

function initTiles(){
 moves=0; movesEl.textContent='0';
 tiles=[0,1,2,3,4,5,6,7,8];
 // shuffle by random valid moves to guarantee solvable
 emptyIdx=8;
 for(let i=0;i<200;i++){
  const neigh=getNeighbors(emptyIdx);
  const r=neigh[Math.floor(Math.random()*neigh.length)];
  [tiles[emptyIdx],tiles[r]]=[tiles[r],tiles[emptyIdx]];
  emptyIdx=r;
 }
 originalOrder=[...tiles];
 render();
}

function getNeighbors(idx){
 const r=Math.floor(idx/3), c=idx%3;
 const n=[];
 if(r>0) n.push(idx-3);
 if(r<2) n.push(idx+3);
 if(c>0) n.push(idx-1);
 if(c<2) n.push(idx+1);
 return n;
}

function render(){
 grid.innerHTML='';
 tiles.forEach((tileVal, pos)=>{
  const div=document.createElement('div');
  div.className='tile'+(pos===emptyIdx?' empty':'');
  if(tileVal===pos && pos!==emptyIdx) div.classList.add('correct');
  if(pos!==emptyIdx){
   const img=document.createElement('img');
   img.src=capturedDataUrl;
   const row=Math.floor(tileVal/3), col=tileVal%3;
   img.style.objectPosition=`${col*50}% ${row*50}%`;
   // Since we use 300% size, need to position
   img.style.width='300%';
   img.style.height='300%';
   img.style.marginLeft=`-${col*100}%`;
   img.style.marginTop=`-${row*100}%`;
   div.appendChild(img);
  }
  div.draggable=false;
  div.addEventListener('pointerdown', (e)=>handleStart(e,pos));
  grid.appendChild(div);
 });
 checkWin();
}

let dragPos=null;
function handleStart(e,pos){
 if(pos===emptyIdx) return;
 if(!getNeighbors(emptyIdx).includes(pos)) return;
 dragPos=pos;
 const move=()=>{
  [tiles[emptyIdx],tiles[pos]]=[tiles[pos],tiles[emptyIdx]];
  emptyIdx=pos;
  moves++; movesEl.textContent=moves;
  render();
 };
 // simple click to move
 move();
}

function checkWin(){
 if(tiles.every((v,i)=>v===i)){
  setTimeout(()=>{
   winMoves.textContent=moves;
   win.style.display='flex';
   launchConfetti();
  },300);
 }
}

function launchConfetti(){
 for(let i=0;i<80;i++){
  const d=document.createElement('div');
  d.className='confetti';
  d.style.left=Math.random()*100+'vw';
  d.style.background=`hsl(${Math.random()*360},100%,60%)`;
  d.style.animationDuration=(Math.random()*2+1)+'s';
  d.style.animationDelay=Math.random()*.5+'s';
  d.style.transform=`rotate(${Math.random()*360}deg)`;
  document.body.appendChild(d);
  setTimeout(()=>d.remove(),4000);
 }
}

shuffleBtn.onclick=initTiles;
resetBtn.onclick=()=>{
 tiles=[...originalOrder];
 emptyIdx=tiles.indexOf(8);
 moves=0; movesEl.textContent='0';
 render();
};
playAgain.onclick=()=>{
 win.style.display='none';
 puzzleWrap.style.display='none';
 stage.style.display='block';
 controls.style.display='flex';
 if(!stream) initCam();
};

 // auto try camera on load if https
 if(location.protocol==='https:' || location.hostname==='localhost'){
  // don't auto, wait user click for permission prompt UX
 }
</script>
</body>
</html>
